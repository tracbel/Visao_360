# CI do CRM Tracbel — issue #56, desenho em docs/projeto/47-CI-CD.md §3.
#
# Três jobs em paralelo, em Linux. O nome de cada job (backend, frontend, seguranca) é o nome da
# checagem que a regra da main exige (#58): renomear aqui quebra a regra.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Push novo no mesmo PR cancela a execução anterior; na main, cada push roda até o fim.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar o .NET do global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache dos pacotes NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar
        run: dotnet restore Tracbel.Crm.sln

      - name: Compilar (aviso é erro)
        run: dotnet build Tracbel.Crm.sln -c Release --no-restore -warnaserror

      - name: Modelo e migrations batem
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project src/Tracbel.Crm.Infraestrutura/Tracbel.Crm.Infraestrutura.csproj \
            --startup-project src/Tracbel.Crm.Api/Tracbel.Crm.Api.csproj \
            --configuration Release --no-build

      # O SQL Server do CI é descartável: a senha é gerada aqui, mascarada no log e some com o
      # contêiner. Nenhum segredo fica cadastrado no GitHub.
      - name: Subir SQL Server 2022 descartável
        run: |
          senha="Ci-$(openssl rand -hex 16)-Aa1"
          echo "::add-mask::$senha"
          echo "SENHA_SQL_CI=$senha" >> "$GITHUB_ENV"
          docker run --detach --name sql-ci --publish 1433:1433 \
            --env ACCEPT_EULA=Y \
            --env MSSQL_PID=Developer \
            --env MSSQL_COLLATION=Latin1_General_CI_AI \
            --env "MSSQL_SA_PASSWORD=$senha" \
            mcr.microsoft.com/mssql/server:2022-latest
          for tentativa in $(seq 1 60); do
            if docker exec sql-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$senha" -C -b -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server respondendo depois de $((tentativa * 2)) s"
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server não respondeu em 120 s"
          docker logs sql-ci | tail -n 50
          exit 1

      - name: Testes
        run: |
          export ConnectionStrings__Crm="Server=localhost,1433;Database=master;User Id=sa;Password=${SENHA_SQL_CI};TrustServerCertificate=True"
          dotnet test Tracbel.Crm.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Conferir resultados (nenhum teste pulado)
        if: always()
        shell: pwsh
        run: ./scripts/ci/conferir-testes.ps1 -Pasta TestResults

      - name: Anexar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-dos-testes
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/Tracbel.Crm.Web
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar o Node do .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: src/Tracbel.Crm.Web/.nvmrc
          cache: npm
          cache-dependency-path: src/Tracbel.Crm.Web/package-lock.json

      - name: Instalar dependências pelo lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      # Os testes de tela (issue #31): vitest + testing-library em jsdom, sem navegador e sem rede.
      # É `npm run test`, e não `vitest` puro: o segundo ficaria observando os arquivos e travaria
      # o job até o tempo limite.
      - name: Testes de tela
        run: npm run test

      - name: Build
        run: npm run build

  # =================================================================================================
  # A CONFERÊNCIA VISUAL — fase T4.5.
  #
  # O QUE ELA PROVA: que a tela de Mercado cabe na largura em que é usada, em seis larguras e nove
  # estados, contra o harness `#/dev/mercado-visual` (amostra fictícia, sem banco e sem rede da
  # Tracbel). Rolagem lateral numa tela de indicadores esconde coluna, e ninguém rola para o lado
  # atrás de um número que não sabe que existe.
  #
  # ELA NÃO ESTÁ NA REGRA DA MAIN (#58), de propósito: as checagens exigidas continuam sendo backend,
  # frontend e seguranca. Esta reporta e anexa as capturas; virar obrigatória é decisão do Ricardo,
  # e é um ajuste de uma linha na regra do repositório.
  #
  # O NAVEGADOR VEM DO CACHE, chaveado pela versão do Playwright no lockfile: sem isso seriam 115 MB
  # baixados a cada PR.
  # =================================================================================================
  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/Tracbel.Crm.Web
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar o Node do .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: src/Tracbel.Crm.Web/.nvmrc
          cache: npm
          cache-dependency-path: src/Tracbel.Crm.Web/package-lock.json

      - name: Instalar dependências pelo lockfile
        run: npm ci

      - name: Descobrir a versão do Playwright
        id: playwright
        run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache do navegador
        id: cache-navegador
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}

      - name: Instalar o Chromium
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Mesmo com o navegador em cache, as bibliotecas de sistema não ficam na imagem.
      - name: Dependências de sistema do navegador
        if: steps.cache-navegador.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # O HARNESS NÃO PODE CHEGAR AO SERVIDOR DE PRODUÇÃO. É o `dist` que viaja dentro do pacote e é
      # servido em https://360-tracbelagro.tracbel.com.br:5443 — amostra fictícia publicada ali seria
      # número inventado numa tela que a diretoria lê.
      - name: Construir e conferir que o harness ficou fora do pacote
        run: |
          npm run build
          npm run visual:conferir-pacote

      - name: Conferência visual
        run: npm run visual

      - name: Anexar as capturas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capturas-da-tela
          path: src/Tracbel.Crm.Web/capturas/
          if-no-files-found: warn
          retention-days: 14

  seguranca:
    name: seguranca
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Histórico completo: a varredura lê toda linha acrescentada em qualquer commit.
      - name: Baixar o código com todo o histórico
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Varredura de segredos (arquivos e histórico)
        shell: pwsh
        run: |
          ./scripts/seguranca/varrer-segredos.ps1 -Relatorio varredura-de-segredos.md
          $codigo = $LASTEXITCODE
          $resumo = Get-Content varredura-de-segredos.md | Where-Object { $_ -match '^(HEAD|Achados):' }
          @('## Varredura de segredos', '') + $resumo | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          exit $codigo

      - name: Anexar o relatório da varredura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: varredura-de-segredos
          path: varredura-de-segredos.md
          if-no-files-found: warn
          retention-days: 14

      # Vulnerabilidades: desde a #59 elas BARRAM, em alta e crítica. Baixa e moderada continuam
      # aparecendo no resumo sem derrubar o job.
      - name: Instalar o .NET do global.json
        if: always()
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # O `dotnet restore` já falha sozinho em alta e crítica (NuGetAudit + "aviso é erro", no
      # Directory.Build.props), e isso derruba o job `backend` primeiro. Este passo existe para
      # dizer QUAL pacote, em tabela legível, e para barrar também quem passe pelo restore —
      # dependência que só o modo transitivo vê, ou projeto fora da solução.
      - name: Pacotes .NET vulneráveis
        if: always()
        shell: pwsh
        run: ./scripts/ci/conferir-vulneraveis.ps1 -Solucao Tracbel.Crm.sln

      - name: Instalar o Node do .nvmrc
        if: always()
        uses: actions/setup-node@v7
        with:
          node-version-file: src/Tracbel.Crm.Web/.nvmrc

      # `--audit-level=high` já devolve código diferente de zero quando acha alta ou crítica: é o
      # bloqueio. O relatório completo (inclusive moderada) vai para o resumo antes dele.
      - name: Pacotes npm vulneráveis
        if: always()
        working-directory: src/Tracbel.Crm.Web
        run: |
          {
            echo "## Pacotes npm vulneráveis"
            echo '```text'
            npm audit --package-lock-only || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm audit --package-lock-only --audit-level=high

  # =================================================================================================
  # O PACOTE DE PUBLICACAO — so na main, so depois dos tres verdes (issue 62).
  #
  # POR QUE ELE EXISTE. Ate 20/09/2026 a publicacao saia da estacao de quem estava programando:
  # `publicar.ps1` compilava ali e copiava para o servidor. Isso significava que o que ia para
  # producao NAO era exatamente o que o CI aprovou — era uma compilacao nova, na maquina de alguem,
  # com o que estivesse no disco. Aqui o pacote nasce do commit que passou, e e ele que viaja.
  #
  # POR QUE O SERVIDOR PUXA, E O GITHUB NAO EMPURRA. Os runners do GitHub ficam na nuvem e nao
  # alcancam o 10.150.4.249 da rede da Tracbel; empurrar exigiria instalar um runner dentro da rede
  # (issue 61, decisao de infraestrutura). MEDIDO em 20/09/2026: o servidor alcanca api.github.com,
  # github.com e codeload.github.com direto, sem proxy. Entao ele baixa este artefato sozinho — e
  # a rede continua fechada para entrada.
  # =================================================================================================
  pacote:
    name: pacote
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend, seguranca]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar o .NET do global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Instalar o Node do .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: src/Tracbel.Crm.Web/.nvmrc

      - name: Instalar dependências do front pelo lockfile
        working-directory: src/Tracbel.Crm.Web
        run: npm ci

      - name: Construir o front
        working-directory: src/Tracbel.Crm.Web
        run: npm run build

      # SELF-CONTAINED, win-x64: o servidor tem .NET 6 e 8, e a solucao esta no 10. Levar o runtime
      # dentro do pacote evita instalar runtime novo numa maquina que ja hospeda outra aplicacao.
      - name: Publicar a API
        run: |
          dotnet publish src/Tracbel.Crm.Api/Tracbel.Crm.Api.csproj \
            -c Release -r win-x64 --self-contained true -o pacote/api

      - name: Publicar a carga
        run: |
          dotnet publish src/Tracbel.Crm.Carga/Tracbel.Crm.Carga.csproj \
            -c Release -r win-x64 --self-contained true -o pacote/carga

      - name: Levar o front para dentro do pacote da API
        run: cp -r src/Tracbel.Crm.Web/dist/. pacote/api/wwwroot/

      # AS ROTINAS AGENDADAS VIAJAM NO PACOTE: o publicar-pacote.ps1 roda este script no servidor a cada
      # publicacao, e a rotina de uma fonte nova chega junto com o codigo que a usa (issue 66).
      - name: Levar as rotinas agendadas para dentro do pacote
        run: |
          mkdir -p pacote/rotinas
          cp scripts/deploy/registrar-rotinas.ps1 pacote/rotinas/

      # O MANIFESTO E O QUE O AGENTE DO SERVIDOR LE ANTES DE PUBLICAR. Ele diz o commit, as migracoes
      # que o pacote carrega e — o que mais importa — SE ALGUMA DELAS E DESTRUTIVA.
      #
      # A analise acontece AQUI, e nao no servidor, porque aqui existe o codigo-fonte: o script SQL
      # idempotente do EF mostra cada comando que a subida vai rodar. No servidor so chega um sim ou
      # nao, que ele nao precisa saber interpretar.
      # O PowerShell 5.1 do servidor lê .ps1 sem BOM como ANSI, e um travessão quebra o parser numa
      # linha que não tem nada de errado. Sem esta checagem, isso só apareceria no servidor — depois
      # de agendado, a cada cinco minutos, em silêncio.
      - name: Os scripts do servidor abrem no PowerShell 5.1
        shell: pwsh
        run: ./scripts/ci/conferir-scripts-do-servidor.ps1

      - name: Manifesto do pacote (e a busca por migração destrutiva)
        shell: pwsh
        run: ./scripts/ci/gerar-manifesto-do-pacote.ps1 -Destino pacote/manifesto.json

      - name: Anexar o pacote
        uses: actions/upload-artifact@v7
        with:
          name: pacote-de-publicacao
          path: pacote/
          if-no-files-found: error
          # CINCO DIAS BASTAM: o agente baixa o pacote minutos depois do merge, e a volta atras usa a
          # copia guardada NO SERVIDOR, nao um pacote antigo. Com 30 dias eram dez pacotes de 104 MB
          # guardados, e o upload passou a receber 403 (21/09/2026, cota de artefatos da organizacao).
          retention-days: 5

      - name: Resumo
        shell: pwsh
        run: |
          $m = Get-Content pacote/manifesto.json -Raw | ConvertFrom-Json
          $linhas = @(
            '## Pacote de publicação',
            '',
            "- commit: ``$($m.commit)``",
            "- migrações no pacote: $($m.migracoes.Count)",
            "- **destrutiva: $(if ($m.temMigracaoDestrutiva) { 'SIM — a publicação vai PARAR e pedir autorização' } else { 'não' })**"
          )
          if ($m.operacoesDestrutivas.Count -gt 0) {
            $linhas += ''
            $linhas += '### O que foi encontrado'
            $linhas += $m.operacoesDestrutivas | ForEach-Object { "- $_" }
          }
          $linhas | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
